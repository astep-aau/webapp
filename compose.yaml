services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - ../data/.env
    environment:
      POSTGRES_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    environment:
      ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - api
