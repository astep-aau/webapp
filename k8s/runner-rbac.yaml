apiVersion: v1
kind: ServiceAccount
metadata:
  name: webapp-deployer
  namespace: main
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: webapp-deployer-token
  namespace: main
  annotations:
    kubernetes.io/service-account.name: webapp-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webapp-deployer
  namespace: main
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["webapp"]
    verbs: ["get", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["webapp"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webapp-deployer
  namespace: main
subjects:
  - kind: ServiceAccount
    name: webapp-deployer
    namespace: main
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webapp-deployer
